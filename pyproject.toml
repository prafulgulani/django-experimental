[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-experimental"
version = "0.1.0"
description = "A Third-Party package to test experimental framework for django."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=4.2",
]
authors = [
    { name = "Praful Gulani", email = "prafulgulani555@gmail.com" },
    { name = "Andrew Miller", email = "andrew@softwarecrafts.co.uk" },
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/django/experimental" = "django/experimental"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["DJ", "E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
force-single-line = true